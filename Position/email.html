<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous">
        <style>
            #one{
                box-sizing: border-box;
                margin: 0px;
                padding: 0px;
            }
        </style>
    </head>
    <body>
        <div
            class="d-flex justify-content-center align-items-center border border-danger"
            style="height: 100vh; width: 100wh;">
            <div class="position-relative"
                id="one">
                <img src="03b6a2c8-63fc-45e1-9b31-fcc168c169f1.png" alt
                    style="height: 100px; width: 200px;">
                <span
                    class="position-absolute rounded-circle bg-danger text-white top-0 start-100 translate-middle py-2 px-1">120<sup>+</sup></span>
            </div>
        </div>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"></script>
    </body>
</html>
