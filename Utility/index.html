<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
            crossorigin="anonymous">
    </head>
    <body>
        <h1>Background</h1>
        <hr>

        <div class="mt-4">
            <h1 class="bg-primary bg-opacity-100">Hello</h1>
            <h1 class="bg-secondary bg-opacity-75">Hello</h1>
            <h1 class="bg-success bg-opacity-50">Hello</h1>
            <h1 class="bg-danger bg-opacity-25">Hello</h1>
            <h1 class="bg-warning bg-opacity-10">Hello</h1>
            <h1 class="bg-info">Hello</h1>
            <h1 class="bg-light">Hello</h1>
            <h1 class="bg-dark">Hello</h1>
            <h1 class="bg-white">Hello</h1>
            <h1 class="bg-body">Hello</h1>
            <h1 class="bg-transparent">Hello</h1>
            <!-- <h1 >Hello</h1> -->
        </div>

        <hr>

        <h1>Borders</h1>
        <hr>

        <div class=" row ms-5 gap-3">
            <div style="height: 100px; width: 100px;"
                class="border border-danger bg-primary border-4"></div>
            <div style="height: 100px; width: 100px;"
                class=" border-top border-danger bg-primary border-4"></div>
            <div style="height: 100px; width: 100px;"
                class=" border-bottom border-danger bg-primary border-4"></div>
            <div style="height: 100px; width: 100px;"
                class=" border-start border-danger bg-primary border-4"></div>
            <div style="height: 100px; width: 100px;"
                class=" border-end border-danger bg-primary border-4"></div>
        </div>

        <div class="row ms-5 mt-5 gap-3">
            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger border-0 rounded"></div>
            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger border-top-0 border-opacity-75 rounded-top"></div>
            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger border-bottom-0 border-opacity-50 rounded-bottom"></div>
            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger border-start-0 rounded-start"></div>
            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger border-end-0 rounded-end"></div>

            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger rounded-5"></div>

            <div style="height: 100px; width: 100px;"
                class="bg-primary border border-4 border-danger rounded-circle"></div>
        </div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
            crossorigin="anonymous"></script>
    </body>
</html>
